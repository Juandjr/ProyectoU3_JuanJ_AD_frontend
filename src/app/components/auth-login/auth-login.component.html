<div class="auth-container">
  <div class="auth-box">
    <header class="auth-header">
      <h3>Iniciar Sesión</h3>
      <p class="subtitle">Accede y únete a la partida</p>
    </header>

    <div *ngIf="message" class="alert" [class.success]="messageType === 'success'" [class.error]="messageType === 'error'">
      <span>{{ message }}</span>
      <button type="button" class="alert-close" (click)="closeMessage()">×</button>
    </div>
    
    <div class="input-group">
      <label for="username">Usuario</label>
      <input id="username" [(ngModel)]="username" placeholder="Introduce tu usuario" />
    </div>

    <div class="input-group">
      <label for="password">Contraseña</label>
      <input id="password" type="password" [(ngModel)]="password" placeholder="Introduce tu contraseña" />
    </div>

    <button class="btn btn-primary" (click)="doLogin()">Ingresar</button>
    
    <div style="margin-top: 1rem; text-align: center;">
      <a href="javascript:void(0)" (click)="onForgotPasswordClick()" style="color: #7fffd4; font-size: 0.9rem; text-decoration: none; font-weight: 600;">¿Olvidaste tu contraseña?</a>
    </div>

    <div class="divider"><span>ó</span></div>
    
    <!-- Contenedor del Botón Oficial de Google Identity Services -->
    <div id="googleBtn" class="google-btn-container"></div>
    
    <div class="switch-auth">
      ¿No tienes una cuenta? <a href="javascript:void(0)" (click)="onRegisterClick()">Regístrate aquí</a>
    </div>
  </div>
</div>
